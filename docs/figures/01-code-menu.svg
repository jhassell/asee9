<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Opening a Codespace from the Code menu"><title>Opening a Codespace from the Code menu</title><rect width="1000" height="420" fill="#ffffff"/><text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#1c2024" font-weight="700" text-anchor="start">Figure 1 — Opening a Codespace</text><text x="30" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">The panel opens on Local. That is not the one you want.</text><rect x="30" y="76" width="250" height="40" rx="8" fill="#1f7a3d" stroke="#1f7a3d" stroke-width="1.5"/><text x="60" y="101" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#ffffff" font-weight="600" text-anchor="start">&lt;&gt;  Code</text><text x="250" y="101" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#ffffff" font-weight="400" text-anchor="start">▾</text><rect x="30" y="128" width="470" height="250" rx="10" fill="#ffffff" stroke="#d5d9de" stroke-width="1.5"/><rect x="30" y="128" width="470" height="46" rx="10" fill="#eef1f4" stroke="#d5d9de" stroke-width="1.5"/><text x="70" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#6b7580" font-weight="600" text-anchor="start">Local</text><text x="200" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#b3123b" font-weight="700" text-anchor="start">Codespaces</text><rect x="185" y="168" width="112" height="4" fill="#b3123b"/><rect x="56" y="200" width="418" height="52" rx="8" fill="#eef1f4" stroke="#d5d9de" stroke-width="1.5"/><text x="76" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6b7580" font-weight="400" text-anchor="start">No codespaces</text><rect x="56" y="272" width="418" height="46" rx="8" fill="#1f7a3d" stroke="#1f7a3d" stroke-width="1.5"/><text x="120" y="301" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#ffffff" font-weight="600" text-anchor="start">Create codespace on main</text><text x="30" y="404" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">Free: this uses your own GitHub account's monthly Codespaces allowance.</text><defs><marker id="a21439" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="600" y1="150" x2="320" y2="152" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a21439)"/><text x="614" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">1. Click the Codespaces tab.</text><text x="614" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">    It is the RIGHT-HAND tab.</text><defs><marker id="a40714" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="600" y1="300" x2="490" y2="296" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a40714)"/><text x="614" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">2. Then click the green</text><text x="614" y="301" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">    Create codespace button.</text><text x="614" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">If you only see "Clone" and "Download ZIP",</text><text x="614" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">you are still on the Local tab.</text></svg>
